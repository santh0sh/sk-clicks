<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#f7f6f2;color:#232824;font-family:'DM Sans',Arial,sans-serif}.top{height:74px;display:flex;align-items:center;justify-content:space-between;padding:0 56px;border-bottom:1px solid #e3e3dc}.logo{font-size:23px;letter-spacing:.13em;font-weight:600}.nav{display:flex;gap:32px;font-size:13px;letter-spacing:.08em}.nav a{color:inherit;text-decoration:none}.nav b{border-bottom:1px solid #222;padding-bottom:7px}.head{text-align:center;padding:66px 15px 48px}.eyebrow{font-size:12px;letter-spacing:.25em;text-transform:uppercase;font-weight:600;color:#707970}.head h1{font:400 57px/1.2 'Playfair Display',Georgia,serif;margin:13px 0 12px}.head p{color:#676d66;font-size:15px;margin:0}.filters{margin:34px auto 0;display:flex;justify-content:center;flex-wrap:wrap;gap:14px 30px;font-size:12px;letter-spacing:.09em}.filters a{color:inherit;text-decoration:none;cursor:pointer}.filters a{position:relative;padding-bottom:8px;transition:color .25s ease}.filters a:hover{color:#92715d}.filters a:after{content:"";position:absolute;bottom:0;left:0;width:100%;height:1px;background:#333;transform:scaleX(0);transform-origin:center;transition:transform .3s ease}.filters a.on:after{transform:scaleX(1)}.photos{max-width:1320px;padding:0 56px 60px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;grid-auto-rows:265px;grid-auto-flow:dense}.photos img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in;transition:transform .65s cubic-bezier(.2,.7,.2,1),filter .55s ease}.photos>div:hover img{transform:scale(1.045);filter:brightness(1.045)}.photos>div{animation:photoEnter .48s both;animation-delay:var(--delay,0ms)}@keyframes photoEnter{from{opacity:0;transform:translateY(13px)}to{opacity:1;transform:translateY(0)}}.photos>div{overflow:hidden}.head{animation:pageIn .55s both}@keyframes pageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}.photos img:focus-visible{outline:3px solid #fff;outline-offset:-5px}.lightbox{position:fixed;inset:0;z-index:100;background:rgba(10,14,13,.96);display:none;align-items:center;justify-content:center;padding:60px 28px 70px}.lightbox.open{display:flex;animation:viewerIn .32s ease both}.lightbox.closing{display:flex;animation:viewerOut .28s ease both}@keyframes viewerIn{from{opacity:0}to{opacity:1}}@keyframes viewerOut{from{opacity:1}to{opacity:0}}.viewerStage{position:relative;width:100%;height:calc(100vh - 130px);overflow:hidden}.viewerStage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transform:translateX(0);pointer-events:none}.viewerStage img.current{opacity:1}.lightbox.open .viewerStage{animation:stageIn .34s cubic-bezier(.2,.7,.2,1) both}.lightbox.closing .viewerStage{animation:stageOut .28s ease both}@keyframes stageIn{from{opacity:0;transform:translateY(9px) scale(.988)}to{opacity:1;transform:none}}@keyframes stageOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(7px) scale(.99)}}.viewerStage img.arriving{opacity:0;transform:translateX(var(--travel));transition:opacity .3s ease,transform .3s cubic-bezier(.22,.7,.22,1)}.viewerStage img.departing{opacity:1;transform:translateX(0);transition:opacity .3s ease,transform .3s cubic-bezier(.22,.7,.22,1)}.viewerStage img.arriving.moving{opacity:1;transform:translateX(0)}.viewerStage img.departing.moving{opacity:0;transform:translateX(var(--exit))}.lightbox button{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.5);color:#fff;cursor:pointer;width:42px;height:42px;font-size:28px;line-height:1;position:absolute;top:16px;right:20px}.lightbox .viewerArrow{top:50%;right:auto;left:12px;transform:translateY(-50%);z-index:2;border-radius:50%;width:46px;height:46px;font:34px/1 Georgia,serif}.lightbox .viewerArrow.next{left:auto;right:12px}.lightbox .viewerArrow:hover{background:rgba(255,255,255,.3)}@media(max-width:650px){.lightbox{padding:70px 12px}.viewerStage{height:calc(100vh - 110px)}.lightbox .viewerArrow{left:8px;width:39px;height:44px;background:rgba(20,25,22,.58)}.lightbox .viewerArrow.next{right:8px;left:auto}}.lightbox button:focus-visible{outline:2px solid white;outline-offset:3px}.photos .span2{grid-row:span 2}.photos .wide{grid-column:span 2}.photos .wide img{object-position:center 46%}.footer{margin:0 56px;border-top:1px solid #dadcd5;padding:25px 0 38px;color:#777;font-size:12px;display:flex;justify-content:space-between}@media(max-width:650px){.top{height:65px;padding:0 20px}.logo{font-size:18px}.nav{gap:11px;font-size:10px}.head{padding:56px 15px 36px}.head h1{font-size:42px}.head p{font-size:13px}.filters{gap:10px 16px;font-size:10px}.photos{padding:0 15px 45px;gap:8px;grid-template-columns:repeat(2,1fr);grid-auto-rows:190px}.photos .wide{grid-column:span 2}.photos .span2{grid-row:span 2}.footer{margin:0 15px}}
.viewerTools{position:absolute;z-index:4;left:50%;bottom:15px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:7px 10px;border:1px solid rgba(255,255,255,.25);border-radius:30px;background:rgba(18,24,21,.75);color:#fff;backdrop-filter:blur(12px)}.lightbox .viewerTools button{position:static;display:grid;place-items:center;width:40px;height:40px;border:0;border-radius:50%;background:transparent;font:20px/1 Arial,sans-serif;flex:none}.lightbox .viewerTools button:hover{background:rgba(255,255,255,.18)}.viewerCounter{min-width:68px;text-align:center;font-size:13px;letter-spacing:.07em;white-space:nowrap}.viewerToast{position:absolute;z-index:5;left:50%;bottom:78px;transform:translateX(-50%);border-radius:5px;background:#fff;color:#232824;padding:9px 14px;font-size:12px;white-space:nowrap}.viewerToast[hidden]{display:none}@media(max-width:650px){.lightbox{padding-bottom:94px}.viewerStage{height:calc(100vh - 164px)}.viewerTools{bottom:20px;gap:2px;padding:5px}.lightbox .viewerTools button{width:39px;height:42px}.viewerCounter{min-width:52px;font-size:12px}.viewerToast{bottom:78px}}</style></head><body><div class="top"><div class="logo">SK CLICKS</div><div class="nav"><a href="index.html">HOME</a><b>WORK</b><a href="about.html">ABOUT</a><a href="contact.html">CONTACT</a></div></div><div class="head"><div class="eyebrow">Selected photographs</div><h1>The work</h1><p>People, nature, light, places and the celebrations in between.</p><div class="filters"><a href="#nature" data-cat="nature" class="on">NATURE</a><a href="#light" data-cat="light">LIGHT</a><a href="#places" data-cat="places">PLACES</a><a href="#events" data-cat="events">FUNCTIONS &amp; FESTIVALS</a><a href="#portraits" data-cat="portraits">PORTRAITS</a><a href="#paws-wings" data-cat="paws-wings">PAWS &amp; WINGS</a></div></div><div class="photos"></div><div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photograph viewer" aria-hidden="true"><button id="lightboxClose" type="button" aria-label="Close photograph">×</button><button class="viewerArrow previous" id="lightboxPrev" type="button" aria-label="Previous photograph">‹</button><div class="viewerStage"><img id="lightboxImage" alt=""><img id="lightboxNextImage" alt=""></div><button class="viewerArrow next" id="lightboxNext" type="button" aria-label="Next photograph">›</button><div class="viewerTools" role="toolbar" aria-label="Photograph controls"><button id="viewerPlay" type="button" aria-label="Play slideshow" title="Play slideshow">▶</button><span id="viewerCounter" class="viewerCounter" aria-live="polite"></span><button id="viewerFullscreen" type="button" aria-label="Enter fullscreen" title="Fullscreen"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button><button id="viewerShare" type="button" aria-label="Share photograph" title="Share photograph">↗</button><button id="viewerClose" type="button" aria-label="Close photograph" title="Close">×</button></div><span id="viewerToast" class="viewerToast" role="status" hidden></span></div><div class="footer"><span>© SK Clicks · Santhosh Kulathumani</span><span>Instagram @skclicks_</span></div><script>
const tabs=[...document.querySelectorAll('.filters a')], valid=new Set(tabs.map(t=>t.dataset.cat));
let photos=[];
async function loadGallery(){
  const grid=document.querySelector('.photos');
  try {
    const response=await fetch('gallery-manifest.json', {cache:'no-cache'});
    if(!response.ok) throw new Error('Gallery list unavailable');
    const items=await response.json();
    for(const item of items){
      if(!valid.has(item.cat) || typeof item.src!=='string' || !/^assets\/[a-z0-9/_-]+\.(jpg|jpeg|png|webp|gif|avif)$/i.test(item.src)) continue;
      const tile=document.createElement('div'),img=document.createElement('img');
      tile.dataset.cat=item.cat;
      if(['span2','wide'].includes(item.class)) tile.className=item.class;
      img.src=item.src;img.alt=item.alt || 'Photograph';img.loading='lazy';
      tile.appendChild(img);grid.appendChild(tile);
    }
    photos=[...grid.children];
    bindPhotos();applyFilter(location.hash.slice(1)||'nature');
  } catch(e){grid.textContent='Gallery photos are temporarily unavailable. Please try refreshing.'}
}
loadGallery();
function applyFilter(cat){if(!valid.has(cat))cat='nature';tabs.forEach(t=>t.classList.toggle('on',t.dataset.cat===cat));let n=0;photos.forEach(d=>{let show=d.dataset.cat===cat;d.hidden=!show;d.style.display=show?'':'none';if(show){d.style.setProperty('--delay',Math.min(n++,9)*35+'ms');d.style.animation='none';void d.offsetWidth;d.style.animation=''}})}
tabs.forEach(t=>t.addEventListener('click',e=>{e.preventDefault();history.replaceState(null,'','#'+t.dataset.cat);applyFilter(t.dataset.cat)}));window.addEventListener('hashchange',()=>applyFilter(location.hash.slice(1)));const viewer=document.getElementById('lightbox'),frames=[document.getElementById('lightboxImage'),document.getElementById('lightboxNextImage')],closeButton=document.getElementById('lightboxClose'),prevButton=document.getElementById('lightboxPrev'),nextButton=document.getElementById('lightboxNext'),playButton=document.getElementById('viewerPlay'),counter=document.getElementById('viewerCounter'),fullscreenButton=document.getElementById('viewerFullscreen'),shareButton=document.getElementById('viewerShare'),toolbarClose=document.getElementById('viewerClose'),toast=document.getElementById('viewerToast');
const reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)');
let lastFocus=null,closingTimer=null,transitionTimer=null,currentIndex=0,activeImages=[],touchX=null,front=0,animating=false,pendingSteps=0,request=0,slideshow=null,toastTimer=null;
function updateCounter(){counter.textContent=(currentIndex+1)+" / "+activeImages.length}
function stopSlideshow(){clearInterval(slideshow);slideshow=null;playButton.textContent="▶";playButton.setAttribute("aria-label","Play slideshow");playButton.title="Play slideshow"}
function toggleSlideshow(){if(slideshow){stopSlideshow();return}if(activeImages.length<2)return;slideshow=setInterval(()=>{if(!document.hidden&&!animating)moveImage(1)},4500);playButton.textContent="Ⅱ";playButton.setAttribute("aria-label","Pause slideshow");playButton.title="Pause slideshow"}
function showToast(text){clearTimeout(toastTimer);toast.textContent=text;toast.hidden=false;toastTimer=setTimeout(()=>toast.hidden=true,2600)}
function currentURL(){return new URL(activeImages[currentIndex].getAttribute("src"),location.href).href}
async function shareImage(){const url=currentURL();try{if(navigator.share){await navigator.share({title:"SK Clicks photograph",url});return}if(navigator.clipboard?.writeText){try{await navigator.clipboard.writeText(url);showToast("Photo link copied");return}catch(e){}}const field=document.createElement("textarea");field.value=url;field.style.position="fixed";field.style.opacity="0";document.body.appendChild(field);field.select();const copied=document.execCommand("copy");field.remove();showToast(copied?"Photo link copied":"Sharing is not available here")}catch(e){if(e.name!=="AbortError")showToast("Could not share this photo")}}
async function toggleFullscreen(){try{if(document.fullscreenElement){await document.exitFullscreen()}else if(viewer.requestFullscreen){await viewer.requestFullscreen()}else{showToast("Fullscreen is not available here")}}catch(e){showToast("Fullscreen is not available here")}}
function updateFullscreen(){const active=!!document.fullscreenElement;fullscreenButton.setAttribute("aria-label",active?"Exit fullscreen":"Enter fullscreen");fullscreenButton.title=active?"Exit fullscreen":"Fullscreen"}
playButton.addEventListener("click",toggleSlideshow);shareButton.addEventListener("click",shareImage);fullscreenButton.addEventListener("click",toggleFullscreen);toolbarClose.addEventListener("click",()=>closeViewer());document.addEventListener("fullscreenchange",updateFullscreen);document.addEventListener("visibilitychange",()=>{if(document.hidden)stopSlideshow()});
function putImage(frame,img){frame.src=img.src;frame.alt=img.alt}
function finishTransition(){
  clearTimeout(transitionTimer);
  frames[front].className='current';
  frames[1-front].className='';
  frames[1-front].removeAttribute('src');
  animating=false;
  if(pendingSteps){const step=Math.sign(pendingSteps);pendingSteps-=step;moveImage(step)}
}
function moveImage(step){
  if(!viewer.classList.contains('open')||activeImages.length<2)return;
  if(animating){pendingSteps+=step;return}
  const nextIndex=(currentIndex+step+activeImages.length)%activeImages.length;
  const next=frames[1-front],old=frames[front],img=activeImages[nextIndex];
  animating=true;const ticket=++request;
  // Decode before replacing the visible image, so slow photos never reveal a blank frame.
  const preload=new Image();preload.src=img.src;
  Promise.resolve(preload.decode?preload.decode():new Promise(resolve=>{preload.onload=resolve;preload.onerror=resolve})).catch(()=>{}).then(()=>{
    if(ticket!==request||!viewer.classList.contains('open'))return;
    putImage(next,img);
    currentIndex=nextIndex;updateCounter();
    if(reducedMotion.matches){old.className='';old.removeAttribute('src');next.className='current';front=1-front;animating=false;return}
    const direction=step>0?1:-1;
    next.style.setProperty('--travel',direction*18+'px');
    old.style.setProperty('--exit',-direction*18+'px');
    next.className='arriving';old.className='departing';
    void next.offsetWidth;
    requestAnimationFrame(()=>{if(ticket===request){next.classList.add('moving');old.classList.add('moving')}});
    front=1-front;
    transitionTimer=setTimeout(finishTransition,330);
  })
}
function bindPhotos(){photos.forEach(d=>{let img=d.querySelector('img');img.tabIndex=0;img.setAttribute('role','button');img.setAttribute('aria-label','Open full photograph: '+img.alt);function open(){
  clearTimeout(closingTimer);clearTimeout(transitionTimer);request++;
  lastFocus=img;activeImages=photos.filter(x=>getComputedStyle(x).display!=='none').map(x=>x.querySelector('img'));
  currentIndex=activeImages.indexOf(img);updateCounter();stopSlideshow();front=0;animating=false;pendingSteps=0;
  frames[1].className='';frames[1].removeAttribute('src');putImage(frames[0],img);frames[0].className='current';
  prevButton.disabled=nextButton.disabled=activeImages.length<2;
  viewer.classList.remove('closing');viewer.classList.add('open');viewer.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';closeButton.focus()
}img.addEventListener('click',open);img.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}})});}
function closeViewer(){if(!viewer.classList.contains('open'))return;
  request++;clearTimeout(transitionTimer);stopSlideshow();pendingSteps=0;animating=false;toast.hidden=true;if(document.fullscreenElement===viewer)document.exitFullscreen().catch(()=>{});
  frames[front].className='current';frames[1-front].className='';
  viewer.classList.remove('open');viewer.classList.add('closing');viewer.setAttribute('aria-hidden','true');document.body.style.overflow='';if(lastFocus)lastFocus.focus();
  closingTimer=setTimeout(()=>{viewer.classList.remove('closing');frames.forEach(f=>f.removeAttribute('src'))},reducedMotion.matches?0:290)
}
closeButton.addEventListener('click',closeViewer);prevButton.addEventListener('click',()=>moveImage(-1));nextButton.addEventListener('click',()=>moveImage(1));viewer.addEventListener('click',e=>{if(e.target===viewer||e.target.classList.contains('viewerStage'))closeViewer()});viewer.addEventListener('touchstart',e=>{touchX=e.changedTouches[0].clientX},{passive:true});viewer.addEventListener('touchend',e=>{if(touchX===null)return;const dx=e.changedTouches[0].clientX-touchX;touchX=null;if(Math.abs(dx)>45)moveImage(dx<0?1:-1)},{passive:true});document.addEventListener('keydown',e=>{if(!viewer.classList.contains('open'))return;if(e.key==='Escape')closeViewer();else if(e.key==='ArrowLeft'){e.preventDefault();moveImage(-1)}else if(e.key==='ArrowRight'){e.preventDefault();moveImage(1)}else if(e.key.toLowerCase()==='f'){e.preventDefault();toggleFullscreen()}else if(e.key==='Tab'){const focusables=[closeButton,prevButton,nextButton,playButton,fullscreenButton,shareButton,toolbarClose].filter(x=>!x.disabled),i=focusables.indexOf(document.activeElement);if(i<0){e.preventDefault();closeButton.focus()}else if(e.shiftKey&&i===0){e.preventDefault();focusables[focusables.length-1].focus()}else if(!e.shiftKey&&i===focusables.length-1){e.preventDefault();focusables[0].focus()}}});
</script></body></html>
